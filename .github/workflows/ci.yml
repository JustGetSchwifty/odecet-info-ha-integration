name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run ruff check custom_components tests dev/check_github_metadata.py
      - run: uv run pytest
      - name: Check GitHub topics and license
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python dev/check_github_metadata.py

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Topics are GitHub repository settings. A deploy key cannot set them.
          # HACS also ignores generic topics such as home-assistant.
          # Add water, energy, and metering in the About box, then delete this ignore.
          ignore: topics
