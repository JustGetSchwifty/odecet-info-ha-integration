[project]
name = "odecet-info"
version = "0.1.0"
description = "Unofficial Home Assistant integration for odecet.info meter readings."
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.10"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-homeassistant-custom-component>=0.13.236",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["custom_components", "tests", "dev"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
